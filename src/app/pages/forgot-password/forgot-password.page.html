<ion-content class="forgot-page" [fullscreen]="true">
  <div class="forgot-shell">
    <header class="forgot-brand">
      <strong>PROCULUS</strong>
      <span>INSTITUTIONAL EXCELLENCE</span>
    </header>

    <main class="forgot-main">
      <section class="forgot-copy">
        <span class="app-section-title">Pemulihan Akun</span>
        <h1>Lupa Password?</h1>
        <p>Ikuti langkah verifikasi OTP untuk membuat password baru dengan aman.</p>
      </section>

      <section class="app-card forgot-card">
        <div class="forgot-stepper" aria-label="Forgot password flow">
          <span [class.is-active]="currentStepIndex === 1"></span>
          <span [class.is-active]="currentStepIndex === 2"></span>
          <span [class.is-active]="currentStepIndex === 3"></span>
        </div>

        <div class="forgot-step" *ngIf="step === 'email'">
          <div class="field-group">
            <label for="email">Email Perusahaan</label>
            <div class="app-input forgot-input">
              <ion-input
                id="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="nama@perusahaan.com"
                [(ngModel)]="email"
                name="email">
              </ion-input>
            </div>
          </div>

          <ion-button
            expand="block"
            class="forgot-button-primary"
            (click)="requestOtp()"
            [disabled]="loading">
            <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
            <span *ngIf="!loading">KIRIM OTP</span>
          </ion-button>
        </div>

        <div class="forgot-step" *ngIf="step === 'otp'">
          <div class="forgot-step__summary">
            <span class="app-section-title">Verifikasi Email</span>
            <strong>{{ email }}</strong>
          </div>

          <div class="field-group">
            <label for="otp">Kode OTP</label>
            <div class="app-input forgot-input">
              <ion-input
                id="otp"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="Masukkan kode OTP"
                [(ngModel)]="otp"
                name="otp">
              </ion-input>
            </div>
          </div>

          <div class="forgot-actions">
            <ion-button
              expand="block"
              fill="outline"
              class="forgot-button-secondary"
              (click)="requestOtp()"
              [disabled]="loading">
              Kirim Ulang OTP
            </ion-button>

            <ion-button
              expand="block"
              class="forgot-button-primary"
              (click)="verifyOtp()"
              [disabled]="loading">
              <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
              <span *ngIf="!loading">VERIFIKASI OTP</span>
            </ion-button>
          </div>
        </div>

        <div class="forgot-step" *ngIf="step === 'password'">
          <div class="forgot-step__summary">
            <span class="app-section-title">Buat Password Baru</span>
            <strong>{{ email }}</strong>
          </div>

          <div class="field-group">
            <label for="password">Password Baru</label>
            <div class="app-input forgot-input">
              <ion-input
                id="password"
                [type]="'password'"
                autocomplete="new-password"
                placeholder="Masukkan password baru"
                [(ngModel)]="password"
                name="password">
              </ion-input>
            </div>
          </div>

          <div class="field-group">
            <label for="passwordConfirmation">Konfirmasi Password</label>
            <div class="app-input forgot-input">
              <ion-input
                id="passwordConfirmation"
                [type]="'password'"
                autocomplete="new-password"
                placeholder="Ulangi password baru"
                [(ngModel)]="passwordConfirmation"
                name="passwordConfirmation">
              </ion-input>
            </div>
          </div>

          <ion-button
            expand="block"
            class="forgot-button-primary"
            (click)="resetPassword()"
            [disabled]="loading">
            <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
            <span *ngIf="!loading">SIMPAN PASSWORD BARU</span>
          </ion-button>
        </div>

        <button
          *ngIf="step !== 'email'"
          type="button"
          class="forgot-back"
          (click)="back()">
          Kembali
        </button>
      </section>
    </main>

    <footer class="forgot-footer">
      <a routerLink="/login">Kembali ke Login</a>
    </footer>
  </div>
</ion-content>
