<ion-content class="profile-page" [fullscreen]="true">
  <div class="page-blob page-blob--top"></div>
  <div class="page-blob page-blob--bottom"></div>

  <div class="page-shell">
    <button class="back-link" routerLink="/dashboard">
      Kembali ke dashboard
    </button>

    <section class="page-header">
      <span class="section-chip">Vendor profile</span>
      <h1>Profil Vendor</h1>
      <p>Perbarui data perusahaan dan lihat status verifikasi akun Anda.</p>
    </section>

    <section class="status-card">
      <div>
        <span class="section-label">Verification status</span>
        <h3>Status Verifikasi</h3>
      </div>

      <ion-badge class="status-badge" [ngClass]="'status-' + vendor.verification_status">
        {{ vendor.verification_status }}
      </ion-badge>
    </section>

    <section class="form-card">
      <div class="field-group">
        <label for="company_name">Company Name</label>
        <div class="field-control">
          <ion-input
            id="company_name"
            type="text"
            placeholder="Company Name"
            [(ngModel)]="vendor.company_name">
          </ion-input>
        </div>
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <div class="field-control">
          <ion-input
            id="email"
            type="email"
            placeholder="Email"
            [(ngModel)]="vendor.email">
          </ion-input>
        </div>
      </div>

      <div class="field-group">
        <label for="address">Address</label>
        <div class="field-control">
          <ion-input
            id="address"
            type="text"
            placeholder="Address"
            [(ngModel)]="vendor.address">
          </ion-input>
        </div>
      </div>

      <div class="field-group">
        <label for="contact">Contact</label>
        <div class="field-control">
          <ion-input
            id="contact"
            type="text"
            placeholder="Contact"
            [(ngModel)]="vendor.contact">
          </ion-input>
        </div>
      </div>

      <ion-button
        expand="block"
        class="primary-button"
        (click)="saveProfile()">
        Simpan Profile
      </ion-button>
    </section>
  </div>
</ion-content>
