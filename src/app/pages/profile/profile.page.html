<ion-content class="profile-page app-page" [fullscreen]="true">
  <div class="app-container profile-container">
    <section class="profile-topbar">
      <div class="profile-topbar__avatar" aria-hidden="true">
        <img *ngIf="avatarUrl" [src]="avatarUrl" class="profile-topbar__avatar-img" alt="Avatar" />
        <span *ngIf="!avatarUrl">{{ vendorInitial }}</span>
      </div>

      <h1>PROCULUS</h1>

      <div class="profile-topbar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 4a4 4 0 0 0-4 4v2.2c0 .8-.24 1.58-.68 2.24L6 14.5V16h12v-1.5l-1.32-2.06A4.2 4.2 0 0 1 16 10.2V8a4 4 0 0 0-4-4Zm-2 14a2 2 0 0 0 4 0" />
        </svg>
      </div>
    </section>

    <section class="profile-hero">
      <div class="profile-hero__portrait">
        <img *ngIf="avatarUrl" [src]="avatarUrl" class="profile-hero__avatar-img" alt="Foto Profil" />
        <div *ngIf="!avatarUrl" class="profile-hero__image" aria-hidden="true">
          <div class="profile-hero__cube"></div>
          <div class="profile-hero__base"></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;">
        <h2 style="margin: 0;">{{ vendor.name || 'Nama Vendor' }}</h2>

        <span
          *ngIf="vendorVerificationStatusLabel === 'Approved' || vendorVerificationStatusLabel === 'Terverifikasi'"
          style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; background-color: #f3d67c !important; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.15);"
          aria-label="Vendor terverifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
      </div>

      <h3 style="margin-top: 6px;">{{ vendor.address || 'Lokasi Vendor' }}</h3>
      
      <div class="profile-hero__badge-container" *ngIf="vendorVerificationStatusLabel !== 'Approved' && vendorVerificationStatusLabel !== 'Terverifikasi'">
        <span class="app-badge" [ngClass]="vendorVerificationBadgeClass">
          {{ vendorVerificationStatusLabel || 'Tidak tersedia' }}
        </span>
      </div>
      </section>

    <section class="profile-menu">
      <!-- Edit Profil Action Card -->
      <a class="profile-menu-card app-card" routerLink="/edit-profile">
        <div class="profile-menu-card__icon" style="background: #f4f5f8;">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <div class="profile-menu-card__content">
          <strong>Edit Profil</strong>
          <p>Kelola informasi akun dan perusahaan</p>
        </div>
        <span class="profile-menu-card__arrow">→</span>
      </a>

      <!-- Kelola Dokumen Action Card -->
      <a class="profile-menu-card app-card" routerLink="/documents">
        <div class="profile-menu-card__icon" style="background: #f4f5f8;">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2-2H12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
        </div>
        <div class="profile-menu-card__content">
          <strong>Kelola Dokumen</strong>
          <p>Upload dan perbarui dokumen vendor</p>
        </div>
        <span class="profile-menu-card__arrow">→</span>
      </a>

      <!-- Bantuan Card -->
      <button class="profile-menu-card app-card" routerLink="/customer-service">
        <div class="profile-menu-card__icon" style="background: #f4f5f8;">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </div>
        <div class="profile-menu-card__content">
          <strong>Bantuan</strong>
          <p>Butuh bantuan atau panduan penggunaan</p>
        </div>
        <span class="profile-menu-card__arrow">→</span>
      </button>

      <!-- Logout Card -->
      <button class="profile-menu-card app-card profile-menu-card--danger" type="button" (click)="confirmLogout()">
        <div class="profile-menu-card__icon" style="background: #f4f5f8;">
          <svg viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </div>
        <div class="profile-menu-card__content">
          <strong>Logout</strong>
          <p>Keluar dengan aman dari akun vendor Anda</p>
        </div>
        <span class="profile-menu-card__arrow">→</span>
      </button>
    </section>
  </div>
</ion-content>
