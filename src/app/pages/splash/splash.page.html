<ion-content class="splash-page app-page" [fullscreen]="true">
  <div class="splash-shape splash-shape--top"></div>
  <div class="splash-shape splash-shape--bottom"></div>

  <div class="app-container splash-container">
    <section class="splash-brand">
      <span class="app-section-title splash-kicker">Aureate Procurement</span>

      <div class="splash-logo">
        <img
         src="assets/logo/bg_remove_Proculus-logo.png"
         alt="Proculus Logo"
      />
      </div>

      <div class="splash-copy">
        <h1 class="app-title">Luxury-grade vendor portal untuk tender dan bidding yang lebih terarah.</h1>
        <p class="app-subtitle">
          Menyiapkan dashboard procurement dengan standar enterprise yang
          bersih, tenang, dan profesional.
        </p>
      </div>

      <div class="app-loading-state splash-loading">
        <strong>Initializing premium workspace</strong>
        <span>Secure vendor session sedang dipersiapkan sebelum aplikasi dibuka.</span>
        <div class="loading-bar">
          <span class="loading-bar__fill"></span>
        </div>
      </div>
    </section>
  </div>
</ion-content>
