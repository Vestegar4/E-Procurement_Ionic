<ion-content class="welcome-page" [fullscreen]="true">
  <div class="welcome-shell">
    <header class="welcome-brand">
      <img
        class="welcome-brand__logo"
        src="assets/logo/bg_remove_Proculus-logo.png"
        alt="Proculus Logo" />
      
    </header>

    <main class="welcome-main">
      
      <section class="welcome-copy">
        <h1>Streamline your procurement journey.</h1>
        <p>
          Experience the precision of high-end institutional reliability. Manage million-dollar contracts with calm authority and effortless friction-free bidding.
        </p>
      </section>

      <section class="welcome-actions">
        <ion-button
          expand="block"
          class="welcome-button-primary"
          (click)="startApp()">
          <span>ENTER THE ECOSYSTEM</span>
          <i aria-hidden="true">→</i>
        </ion-button>

        <ion-button
          expand="block"
          fill="clear"
          class="welcome-button-secondary"
          routerLink="/login">
          VENDOR LOGIN
        </ion-button>
      </section>
    </main>

    <footer class="welcome-footer">
      INSTITUTIONAL GRADE • HIGH-STAKES SECURITY
    </footer>
  </div>
</ion-content>
